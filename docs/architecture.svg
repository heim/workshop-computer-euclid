<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Euclid4 dual-core architecture">
<rect x="0" y="0" width="880" height="470" rx="14" fill="#0e1116"/>
<text x="30" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e6edf3" text-anchor="start" font-weight="700" letter-spacing="0">Dual-core architecture — the audio interrupt stays sacred</text>
<text x="30" y="68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e" text-anchor="start" font-weight="400" letter-spacing="0">The whole USB stack runs on core 1, so it never delays the 48 kHz audio interrupt on core 0.</text>
<rect x="40" y="100" width="360" height="250" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
<text x="60" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#38bdf8" text-anchor="start" font-weight="700" letter-spacing="0">core 0 — audio</text>
<text x="60" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" letter-spacing="0">48 kHz DMA/PWM interrupt</text>
<circle cx="66" cy="180" r="3" fill="#38bdf8"/>
<text x="80" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="400" letter-spacing="0">ComputerCard DSP loop</text>
<circle cx="66" cy="209" r="3" fill="#38bdf8"/>
<text x="80" y="213" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="400" letter-spacing="0">euclidean generators A + B</text>
<circle cx="66" cy="238" r="3" fill="#38bdf8"/>
<text x="80" y="242" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="400" letter-spacing="0">reads knobs, clock, reset</text>
<circle cx="66" cy="267" r="3" fill="#38bdf8"/>
<text x="80" y="271" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="400" letter-spacing="0">drives Pulse / Audio / CV out</text>
<circle cx="66" cy="296" r="3" fill="#38bdf8"/>
<text x="80" y="300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="400" letter-spacing="0">applies USB writes, publishes state</text>
<rect x="480" y="100" width="360" height="150" rx="10" fill="#161b22" stroke="#fb923c" stroke-width="1.5"/>
<text x="500" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#fb923c" text-anchor="start" font-weight="700" letter-spacing="0">core 1 — USB</text>
<text x="500" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" letter-spacing="0">TinyUSB CDC · USBCTRL interrupt</text>
<circle cx="506" cy="180" r="3" fill="#fb923c"/>
<text x="520" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="400" letter-spacing="0">parse SET / GET / RESET lines</text>
<circle cx="506" cy="206" r="3" fill="#fb923c"/>
<text x="520" y="210" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="start" font-weight="400" letter-spacing="0">push state as JSON (~30/s max)</text>
<rect x="480" y="300" width="360" height="64" rx="10" fill="#1c232d" stroke="#2b333e" stroke-width="1"/>
<text x="500" y="328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="700" letter-spacing="0">Browser — Web Serial UI</text>
<text x="500" y="348" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" letter-spacing="0">step rings · sliders · reset</text>
<line x1="478" y1="170" x2="410.5" y2="170.0" stroke="#3fb950" stroke-width="2.4"/><polygon points="402.0,170.0 410.5,164.9 410.5,175.1" fill="#3fb950"/>
<text x="440.0" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#3fb950" text-anchor="middle" font-weight="600" letter-spacing="0">parameters</text>
<text x="440.0" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" letter-spacing="0">dirty-flag mailbox</text>
<line x1="402" y1="250" x2="469.5" y2="250.0" stroke="#38bdf8" stroke-width="2.4"/><polygon points="478.0,250.0 469.5,255.1 469.5,244.9" fill="#38bdf8"/>
<text x="440.0" y="240" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="600" letter-spacing="0">state snapshot</text>
<text x="440.0" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" letter-spacing="0">seqlock</text>
<line x1="660.0" y1="252" x2="660.0" y2="289.5" stroke="#fb923c" stroke-width="2.4"/><polygon points="660.0,298.0 654.9,289.5 665.1,289.5" fill="#fb923c"/>
<text x="672.0" y="279.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" letter-spacing="0">USB CDC (serial)</text>
<line x1="220.0" y1="352" x2="220.0" y2="381.5" stroke="#38bdf8" stroke-width="2.4"/><polygon points="220.0,390.0 214.9,381.5 225.1,381.5" fill="#38bdf8"/>
<text x="232.0" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" letter-spacing="0">clock/reset in · Pulse/Audio/CV out</text>
<text x="40" y="452" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" letter-spacing="0">No locks in the audio interrupt: core 0 only reads a few volatile flags and increments a version counter.</text>
</svg>